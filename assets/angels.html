<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.12/controls.min.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #000; color: #efeff1; font-family: system-ui, sans-serif; }

    .stage { position: relative; width: 100%; height: 100%; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }

    #status {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 16px; text-align: center; font-size: 16px;
      pointer-events: none; text-shadow: 0 1px 4px #000;
    }
    #status:empty { display: none; }

    /* selected server in the menu */
    .server-menu button[aria-selected="true"] span { font-weight: 700; }
    .server-menu button[aria-selected="true"] span::after { content: " \2713"; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="player" autoplay playsinline></video>
    <p id="status">Loading…</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.12/shaka-player.ui.min.js"></script>
  <script defer src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>
  <script type="text/javascript" src="/assets/player.js"></script>
</body>
</html>
