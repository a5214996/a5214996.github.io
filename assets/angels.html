<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream</title>
  <style>
    body { margin: 0; background: #0e0e10; color: #efeff1; font-family: system-ui, sans-serif; }
    nav { display: flex; gap: 8px; padding: 8px; }
    button { padding: 6px 12px; border: 0; border-radius: 4px; background: #26262c; color: inherit; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    button[aria-pressed="true"] { background: #9147ff; }
    #status { margin: 0 8px 8px; font-size: 14px; }
    video { display: block; width: 100%; max-height: calc(100vh - 90px); background: #000; }
  </style>
</head>
<body>
  <nav>
    <button data-region="ams" title="Amsterdam" disabled>AMS</button>
    <button data-region="fra" title="Frankfurt" disabled>FRA</button>
    <button data-region="nyc" title="New York" disabled>NYC</button>
    <button data-region="sfo" title="San Francisco" disabled>SFO</button>
    <button data-region="sgp" title="Singapore" disabled>SGP</button>
  </nav>
  <p id="status">Looking for stream…</p>
  <video id="player" controls autoplay playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const CONFIG_URL = "/data/video.json"; // adjust to where your video.json lives
    const EDGES = {
      ams: "ams1.angelthump.com",
      fra: "fra1.angelthump.com",
      nyc: "nyc1.angelthump.com",
      sfo: "sfo1.angelthump.com",
      sgp: "sgp1.angelthump.com",
    };

    const video = document.getElementById("player");
    const statusEl = document.getElementById("status");
    const buttons = [...document.querySelectorAll("[data-region]")];
    let hls = null;
    let sessionId = null;

    async function loadChannel() {
      const res = await fetch(CONFIG_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`video.json returned ${res.status}`);
      const config = await res.json();
      const channel = String(config.channel || "").trim().toLowerCase();
      if (!/^[a-z0-9_]{1,32}$/.test(channel)) throw new Error("Bad channel in video.json");
      return channel;
    }

    async function findSessionId(channel) {
      const res = await fetch(
        `https://api.angelthump.com/v3/streams?username=${encodeURIComponent(channel)}`
      );
      if (!res.ok) throw new Error(`AngelThump returned ${res.status}`);
      const streams = await res.json();
      const stream = streams.find((s) => s.type === "live");
      if (!stream) return null;
      const username = stream.user.username;
      return `${btoa(stream.createdAt + username)}_${username}`;
    }

    function play(region) {
      const url = `https://${EDGES[region]}/hls/${sessionId}/index.m3u8`;

      buttons.forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.region === region))
      );
      localStorage.setItem("region", region);
      statusEl.textContent = "";

      if (hls) { hls.destroy(); hls = null; }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_e, data) => {
          if (data.fatal) statusEl.textContent = `${region.toUpperCase()} failed — try another server`;
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url; // native HLS (Safari)
        video.play().catch(() => {});
      } else {
        statusEl.textContent = "This browser can't play HLS.";
      }
    }

    (async () => {
      let channel;
      try {
        channel = await loadChannel();
      } catch {
        statusEl.textContent = "Couldn't read video.json.";
        return;
      }

      try {
        sessionId = await findSessionId(channel);
      } catch {
        statusEl.textContent = "Couldn't reach AngelThump.";
        return;
      }
      if (!sessionId) {
        statusEl.textContent = `${channel} is offline.`;
        return;
      }

      buttons.forEach((b) => {
        b.disabled = false;
        b.addEventListener("click", () => play(b.dataset.region));
      });
      const saved = localStorage.getItem("region");
      play(EDGES[saved] ? saved : "ams");
    })();
  </script>
</body>
</html>
